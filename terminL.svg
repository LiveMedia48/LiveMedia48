  <text x="20" y="260" class="text"><tspan class="red">root</tspan> <tspan class="yellow">1337</tspan> 0.0 0.1 <tspan class="blue">/usr/bin/liveMedia48 --stealth --no-logs</tspan></text>
  
  <text x="20" y="300" class="text"><tspan class="red">[ OFFENSIVE ]</tspan> <tspan class="white">Burp Suite · Metasploit · Cobalt Strike · Sliver · Nmap · ffuf</tspan></text>
  <text x="20" y="320" class="text"><tspan class="yellow">[ RECON     ]</tspan> <tspan class="white">Subfinder · Amass · httpx · Nuclei · Shodan · theHarvester</tspan></text>
  <text x="20" y="340" class="text"><tspan class="green">[ EXPLOIT   ]</tspan> <tspan class="white">SQLi · XSS · SSRF · RCE · LFI/RFI · AD Attacks · PrivEsc</tspan></text>
