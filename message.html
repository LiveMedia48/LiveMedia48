
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message LiveMedia48</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:#080d18;
  color:#fff;
  font-family:Arial,sans-serif;
}
.card{
  width:100%;
  max-width:440px;
  padding:26px;
  border:1px solid #263750;
  border-radius:18px;
  background:#101a2b;
}
h1{color:#38bdf8;margin-top:0}
p{color:#a9b8cc;line-height:1.5}
input,textarea{
  width:100%;
  padding:13px;
  margin:9px 0;
  border:1px solid #34465f;
  border-radius:9px;
  background:#091322;
  color:white;
  font-size:15px;
}
textarea{min-height:120px;resize:vertical}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#0284c7;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6}
#status{margin-top:14px;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Message LiveMedia48 👋</h1>
  <p>Have a question or want to connect? Send me a message.</p>

  <form id="messageForm">
    <input id="name" placeholder="Your Name" required maxlength="80">
    <input id="github" placeholder="GitHub Username (optional)" maxlength="39">
    <textarea id="message" placeholder="Write your message..." required maxlength="2000"></textarea>
    <button id="sendBtn" type="submit">Send Message</button>
  </form>

  <div id="status"></div>
</div>

<script>
document.getElementById("messageForm").addEventListener("submit", async function(e){
  e.preventDefault();
  document.getElementById("status").textContent =
    "Message service setup pending.";
});
</script>
</body>
</html>
